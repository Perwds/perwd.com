name: Orange server

# Builds the Orange server jar (a Paper fork) from server/.
on:
  push:
    paths:
      - server/**
      - .github/workflows/orange-server.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure git (paperweight commits while applying patches)
        run: |
          git config --global user.name "Orange CI"
          git config --global user.email "orange-ci@users.noreply.github.com"
      - name: Apply patches
        run: ./gradlew applyAllPatches --stacktrace --console=plain
      - name: Build server jar
        run: ./gradlew createMojmapPaperclipJar --stacktrace --console=plain
      - name: Show output
        run: ls -la orange-server/build/libs/
      - uses: actions/upload-artifact@v4
        with:
          name: orange-server
          path: server/orange-server/build/libs/*paperclip*.jar
