name: Chunk generation benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - ci/chunkgen_benchmark.py
      - .github/workflows/chunkgen-benchmark.yml

jobs:
  chunkgen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :orange-launcher:shadowJar --console=plain
      - run: python3 ci/chunkgen_benchmark.py orange-launcher/build/libs/orange.jar
