name: Server test

# Boots real servers with Orange and checks the launcher, agent, optimizer and plugin end to end.
on:
  push:
  workflow_dispatch:

jobs:
  server-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: paper, java: 21 }
          - { server: paper, java: 25 }
          - { server: purpur, java: 25 }
          - { server: download, java: 21 }
          - { server: download, java: 25 }
          - { server: switch, java: 21 }
    name: ${{ matrix.server }} (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :orange-launcher:shadowJar :folia-test-plugin:jar --console=plain
      - run: python3 ci/server_test.py ${{ matrix.server }} orange-launcher/build/libs/orange.jar
        env:
          ORANGE_DEBUG: 1
          FOLIA_TEST_PLUGIN: ci/folia-test-plugin/build/libs/FoliaTest.jar
      - name: Decompile patch targets
        if: matrix.server == 'paper' && matrix.java == 25
        run: |
          curl -sSfL -o vineflower.jar https://repo.maven.apache.org/maven2/org/vineflower/vineflower/1.12.0/vineflower-1.12.0.jar
          python3 ci/decompile.py run-paper-java25 vineflower.jar decompiled
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-${{ matrix.server }}-java${{ matrix.java }}
          path: |
            run-*/*.log
            run-*/logs/latest.log
            run-*/*.yml
            run-*/config/*.yml
            run-*/server.properties
