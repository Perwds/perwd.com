name: Benchmark

# Plain Paper vs Paper through Orange, 8 GB heap each, same machine, same load.
on:
  workflow_dispatch:
  push:
    paths:
      - ci/benchmark.py
      - .github/workflows/benchmark.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :orange-launcher:shadowJar --console=plain
      - run: python3 ci/benchmark.py orange-launcher/build/libs/orange.jar
        env:
          JAVA_VERSION: 25
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-logs
          path: |
            bench-*/bench.log
            bench-*/warmup.log
