# Orange plugin settings. /orange reload applies changes.

# Lowers view distance while the server is struggling and puts it back when it recovers, so the
# server stays at 20 TPS instead of rubber-banding. View distance only changes how far players can
# see, not how the world behaves. Needs Paper (or a Paper fork); disabled automatically on Spigot.
governor:
  enabled: true
  # Also lower simulation distance. Much bigger TPS win, but chunks at the edge stop ticking, so
  # farms there pause. Off by default to keep gameplay vanilla.
  adjust-simulation-distance: false
  check-interval-seconds: 10
  # Average milliseconds per tick (50 = the tick budget). Above "high" we shed load, below "low" we restore.
  mspt-high: 45.0
  mspt-low: 30.0
  min-simulation-distance: 3
  min-view-distance: 5

# Stops mob farms and breeding pens from piling hundreds of the same mob into one chunk.
# Off by default because it isn't vanilla behaviour.
entity-limiter:
  enabled: false
  # Max entities of the same type in one chunk before more stop spawning.
  max-per-type-per-chunk: 40
  # Per-type overrides (Bukkit EntityType names).
  overrides:
    CHICKEN: 30
    COW: 30
    SHEEP: 30
    PIG: 30
    VILLAGER: 30
  # Spawn reasons the limiter applies to. Commands, plugins and spawn eggs are never limited.
  reasons:
    - NATURAL
    - SPAWNER
    - BREEDING
    - EGG
    - BUILD_IRONGOLEM
    - VILLAGE_DEFENSE
    - RAID
    - PATROL
    - SLIME_SPLIT

# /orange pregen <world> <radius>: generates chunks ahead of time so players never trigger
# generation, the biggest single source of lag. Doesn't change the world at all.
pregen:
  # Chunks generated in parallel. Higher is faster but uses more CPU.
  parallel-chunks: 16
  # Pause while the server is busier than this (milliseconds per tick).
  pause-above-mspt: 40.0

# Help for players on slow or far-away connections. Nothing here changes game mechanics.
ping:
  # When a player's ping stays above high-ping-ms, send them fewer chunks (they see a bit less
  # far) so their connection has room for movement and combat updates. Restored once their
  # ping drops below recover-ping-ms. The world still simulates normally. Needs Paper.
  adaptive-send-distance:
    enabled: true
    high-ping-ms: 250
    recover-ping-ms: 180
    send-distance: 6
    # Minimum time between changes for one player, so it doesn't flip back and forth.
    hold-seconds: 30
