# Orange plugin settings. /orange reload applies changes.

# Lowers view/simulation distance while the server is struggling and puts it back when it recovers.
# Players far from lag sources never notice; the server stays at 20 TPS instead of rubber-banding.
# Needs Paper (or a Paper fork). Disabled automatically on Spigot.
governor:
  enabled: true
  check-interval-seconds: 10
  # Average milliseconds per tick (50 = the tick budget). Above "high" we shed load, below "low" we restore.
  mspt-high: 45.0
  mspt-low: 30.0
  min-simulation-distance: 3
  min-view-distance: 5

# Stops mob farms and breeding pens from piling hundreds of the same mob into one chunk.
entity-limiter:
  enabled: true
  # Max entities of the same type in one chunk before more stop spawning.
  max-per-type-per-chunk: 40
  # Per-type overrides (Bukkit EntityType names).
  overrides:
    CHICKEN: 30
    COW: 30
    SHEEP: 30
    PIG: 30
    VILLAGER: 30
  # Spawn reasons the limiter applies to. Commands, plugins and spawn eggs are never limited.
  reasons:
    - NATURAL
    - SPAWNER
    - BREEDING
    - EGG
    - BUILD_IRONGOLEM
    - VILLAGE_DEFENSE
    - RAID
    - PATROL
    - SLIME_SPLIT
